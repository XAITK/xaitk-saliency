name: Unit Testing

on:
  push:
    branches:
      - master
      - release
  pull_request:
    branches:
      - master
      - release
      - update-to-v*
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.tox-env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        tox-env: ["core", "tools", "maite", "maite-tools", "notebooks"]
    # notebooks jobs are allowed to fail for now
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tox
        continue-on-error: ${{ matrix.tox-env == 'notebooks' }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          TOX_ENV: ${{ matrix.tox-env }}
        # Convert PYTHON_VERSION (3.10) to tox factor (py310) and run specific env
        run: tox -e "py${PYTHON_VERSION//./}-${TOX_ENV}"
      - name: Upload coverage and junit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.tox-env }}
          path: |
            .coverage.*
            .junit.*.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  doctests:
    name: doctests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-tox
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tox
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: tox -e "py${PYTHON_VERSION//./}-doctests"

  coverage:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-tox
        with:
          python-version: "3.10"
      - name: Download coverage data from pytest jobs
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
      - name: Combine coverage and enforce threshold
        run: tox -e coverage
      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: CodeCov report submission
        uses: codecov/codecov-action@fdcc8476540edceab3de004e990f80d881c6cc00  # v5.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests
          skip_validation: true

  notebooks:
    name: notebook (${{ matrix.notebook-file }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_notebooks
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        notebook-file: [
            "atari_deepRL_saliency.ipynb",
            "DRISE.ipynb",
            "MC_RISE.ipynb",
            "MNIST_scikit_saliency.ipynb",
            "OcclusionSaliency.ipynb",
            "Radial_Image_Perturbation.ipynb",
            "SimilarityScoring.ipynb",
            "SuperPixelSaliency.ipynb",
            "SwappableImplementations.ipynb",
            # VIAME notebook takes longer than 60 minutes to execute (timeout limit)
            #"VIAME_OcclusionSaliency.ipynb",
            "SerializedDetectionSaliency.ipynb",
            # Model comparison example is excluded due to computational complexity
            #"ModelComparisonWithSaliency.ipynb",
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-tox
        with:
          python-version: "3.13"
      - name: Run notebook
        env:
          NOTEBOOK_FILE: ${{ matrix.notebook-file }}
        run: tox -r -e papermill -- "docs/examples/${NOTEBOOK_FILE}" /dev/null
