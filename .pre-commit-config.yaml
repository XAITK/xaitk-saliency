- repo: local
  hooks:
    - id: ruff-lint
      name: ruff-lint
      entry: poetry run ruff check --config pyproject.toml --fix --force-exclude
      require_serial: true
      language: system
      types_or: [python, pyi, jupyter]
    - id: sphinx-lint
      name: sphinx-lint
      entry: poetry run sphinx-lint --enable all --disable leaked-markup --jobs 1 --max-line-length 120 docs
      types: [rst]
      language: system
    - id: ruff-format
      name: ruff-format
      entry: poetry run ruff format --config pyproject.toml --force-exclude
      require_serial: true
      language: system
      types_or: [python, pyi, jupyter]
    - id: pyright-internal
      name: pyright-internal
      require_serial: true
      language: system
      entry: poetry run pyright
      types: [file, python]
    - id: pyright-external
      name: pyright-external
      require_serial: true
      language: system
      entry: poetry run pyright --verifytypes xaitk_saliency --ignoreexternal src/xaitk_saliency
      types: [file, python]
