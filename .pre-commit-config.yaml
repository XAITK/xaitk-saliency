- repo: local
  # These entries are bare commands on purpose. `language: system` runs a hook in
  # whatever environment pre-commit was invoked from, so naming no environment here
  # lets the same config serve tox, Poetry, and the git hook. Hard-coding
  # `poetry run` pinned every hook to one developer's venv, and pyright then
  # type-checked against whatever versions happened to be in it.
  #
  # Pick whichever fits; all three run identically:
  #
  #   tox -e pre-commit                     # what CI runs; installs every extra
  #   poetry run pre-commit run --all-files
  #   PATH="$PWD/.tox/pre-commit/bin:$PATH" pre-commit run --all-files
  #
  # The same applies at commit time -- `poetry run git commit` and a plain
  # `git commit` differ only in which environment the hooks inherit.
  #
  # Whatever you choose has to satisfy pyproject.toml, extras included: pyright
  # reports real failures against a stale or extras-less environment. The tox env
  # is built from the declared constraints every run, so it cannot drift; for
  # Poetry, keep it synced with
  #   poetry sync --with main,linting,tests,docs --all-extras
  hooks:
    - id: ruff-lint
      name: ruff-lint
      entry: ruff check --config pyproject.toml --fix --force-exclude
      require_serial: true
      language: system
      types_or: [python, pyi, jupyter]
    - id: sphinx-lint
      name: sphinx-lint
      entry: sphinx-lint --enable all --disable leaked-markup --jobs 1 --max-line-length 120 docs
      types: [rst]
      language: system
    - id: ruff-format
      name: ruff-format
      entry: ruff format --config pyproject.toml --force-exclude
      require_serial: true
      language: system
      types_or: [python, pyi, jupyter]
    - id: pyright-internal
      name: pyright-internal
      require_serial: true
      language: system
      entry: pyright
      types: [file, python]
    - id: pyright-external
      name: pyright-external
      require_serial: true
      language: system
      entry: pyright --verifytypes xaitk_saliency --ignoreexternal src/xaitk_saliency
      types: [file, python]
